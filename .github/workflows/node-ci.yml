name: Node CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Node project directory relative to the repository root.
        required: false
        type: string
        default: .
      node-version:
        description: Exact Node.js major or semantic version.
        required: true
        type: string
      package-manager:
        description: Supported package manager (npm, pnpm, or yarn).
        required: false
        type: string
        default: npm
      allow-install-scripts:
        description: Allow dependency lifecycle scripts during installation.
        required: false
        type: boolean
        default: false
      run-lint:
        description: Run the package lint script.
        required: false
        type: boolean
        default: true
      run-test:
        description: Run the package test script.
        required: false
        type: boolean
        default: true
      run-build:
        description: Run the package build script.
        required: false
        type: boolean
        default: true

permissions: read-all

jobs:
  test:
    name: Install, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKING_DIRECTORY}" =~ ^[A-Za-z0-9._/-]+$ ]] \
            || [[ "${WORKING_DIRECTORY}" == /* ]] \
            || [[ "${WORKING_DIRECTORY}" == *".."* ]] \
            || [[ "${WORKING_DIRECTORY}" == *//* ]]; then
            echo "Working directory must be a safe repository-relative path."
            exit 1
          fi
          if [[ ! "${NODE_VERSION}" =~ ^[0-9]+([.][0-9]+([.][0-9]+)?)?$ ]]; then
            echo "Node version must be numeric and exact to a major, minor, or patch version."
            exit 1
          fi
          case "${PACKAGE_MANAGER}" in
            npm|pnpm|yarn) ;;
            *) echo "Unsupported package manager."; exit 1 ;;
          esac

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          ALLOW_INSTALL_SCRIPTS: ${{ inputs.allow-install-scripts }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          if [[ "${ALLOW_INSTALL_SCRIPTS}" == "true" ]]; then
            case "${PACKAGE_MANAGER}" in
              npm) npm ci ;;
              pnpm) corepack pnpm install --frozen-lockfile ;;
              yarn) corepack yarn install --immutable ;;
            esac
          else
            case "${PACKAGE_MANAGER}" in
              npm) npm ci --ignore-scripts ;;
              pnpm) corepack pnpm install --frozen-lockfile --ignore-scripts ;;
              yarn) corepack yarn install --immutable --mode=skip-builds ;;
            esac
          fi

      - name: Lint
        if: inputs.run-lint
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: '"${PACKAGE_MANAGER}" run lint'

      - name: Test
        if: inputs.run-test
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: '"${PACKAGE_MANAGER}" run test'

      - name: Build
        if: inputs.run-build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: '"${PACKAGE_MANAGER}" run build'
