name: Validate GitHub Actions

on:
  workflow_call:

permissions: read-all

jobs:
  policy:
    name: workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Enforce immutable action references and narrow authority
        shell: bash
        run: |
          set -euo pipefail
          failed=false
          while IFS= read -r workflow; do
            while IFS= read -r use_line; do
              reference="${use_line#*uses:}"
              reference="${reference%%#*}"
              reference="${reference//\"/}"
              reference="${reference//\'/}"
              reference="${reference//[[:space:]]/}"
              [[ "${reference}" == ./* ]] && continue
              if [[ ! "${reference}" =~ @([a-f0-9]{40})$ ]]; then
                echo "Unpinned external action in ${workflow}: ${reference}"
                failed=true
              fi
            done < <(grep -E '^[[:space:]]*(-[[:space:]]*)?uses:' "${workflow}" || true)
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print)
          if grep -R -n -E 'secrets:[[:space:]]*inherit|permissions:[[:space:]]*write-all' .github/workflows; then
            echo "Forbidden broad secret or permission configuration found."
            failed=true
          fi
          [[ "${failed}" == "false" ]]

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan workflow security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          inputs: .
          online-audits: true
          persona: regular
          version: v1.29.0
