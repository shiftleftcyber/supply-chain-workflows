name: Generate and Protect Container SBOM

on:
  workflow_call:
    inputs:
      image-ref:
        description: Fully qualified digest-qualified OCI image reference.
        required: true
        type: string
      registry:
        description: Registry hostname for a private image, or empty for public images.
        required: false
        type: string
        default: ''
      workload-identity-provider:
        description: Google Workload Identity Provider for private GAR images.
        required: false
        type: string
        default: ''
      service-account:
        description: Google service-account email for private GAR images.
        required: false
        type: string
        default: ''
      secure-sbom-signing-key-id:
        description: SecureSBOM signing-key identifier.
        required: true
        type: string
      file-prefix:
        description: Safe filename prefix.
        required: true
        type: string
      artifact-name:
        description: Artifact containing generated SBOM evidence.
        required: false
        type: string
        default: signed-container-sbom
    secrets:
      secure-sbom-api-key:
        description: SecureSBOM API key.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  sbom:
    name: Generate, sign, and verify container SBOM
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs
        id: files
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          FILE_PREFIX: ${{ inputs.file-prefix }}
          IMAGE_REF: ${{ inputs.image-ref }}
          REGISTRY: ${{ inputs.registry }}
          SERVICE_ACCOUNT: ${{ inputs.service-account }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.workload-identity-provider }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_REF}" =~ ^[a-z0-9][a-z0-9.:/_-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Image reference must be fully qualified and digest-qualified."
            exit 1
          fi
          configured=0
          [[ -n "${REGISTRY}" ]] && configured=$((configured + 1))
          [[ -n "${SERVICE_ACCOUNT}" ]] && configured=$((configured + 1))
          [[ -n "${WORKLOAD_IDENTITY_PROVIDER}" ]] && configured=$((configured + 1))
          if [[ "${configured}" -ne 0 && "${configured}" -ne 3 ]]; then
            echo "Private registry authentication inputs must be configured together."
            exit 1
          fi
          for candidate in "${ARTIFACT_NAME}" "${FILE_PREFIX}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
              echo "Artifact and file names must contain only safe characters."
              exit 1
            fi
          done
          {
            echo "unsigned=${FILE_PREFIX}.container.cdx.json"
            echo "signed=${FILE_PREFIX}.container.cdx.signed.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        id: google-auth
        if: inputs.workload-identity-provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: false
          token_format: access_token
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Authenticate Docker to Artifact Registry
        if: inputs.workload-identity-provider != ''
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ inputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}

      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: cyclonedx
          output: ${{ steps.files.outputs.unsigned }}

      - name: Sign container SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.unsigned }}
          secure_sbom_action: sign_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Verify signed container SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.signed }}
          secure_sbom_action: verify_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Upload container SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.files.outputs.unsigned }}
            ${{ steps.files.outputs.signed }}
