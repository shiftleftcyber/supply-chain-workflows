name: Release and Attest Go Artifacts

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod relative to the repository root.
        required: false
        type: string
        default: go.mod
      working-directory:
        description: GoReleaser working directory relative to the repository root.
        required: false
        type: string
        default: .
      config:
        description: GoReleaser configuration path relative to the working directory.
        required: false
        type: string
        default: .goreleaser.yaml
      checksum-file:
        description: GoReleaser checksum file relative to the working directory.
        required: false
        type: string
        default: dist/checksums.txt
      evidence-artifact-name:
        description: Optional workflow artifact containing one file to attach to the GitHub release.
        required: false
        type: string
        default: ''
      evidence-file:
        description: Optional filename inside the evidence artifact to attach to the GitHub release.
        required: false
        type: string
        default: ''
      update-major-tag:
        description: Move the corresponding vN compatibility tag after the release succeeds.
        required: false
        type: boolean
        default: false
      use-existing-draft:
        description: Finalize an existing draft release during a default-branch workflow dispatch.
        required: false
        type: boolean
        default: false
      release-tag:
        description: Existing draft release tag. Required when use-existing-draft is true.
        required: false
        type: string
        default: ''

# Preserve the maximum scopes authorized by the caller; the release job
# explicitly declares the same release-only scopes below.
permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: Publish Go release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.use-existing-draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate inputs and tag
        id: validate
        shell: bash
        env:
          CHECKSUM_FILE: ${{ inputs.checksum-file }}
          CONFIG: ${{ inputs.config }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence-artifact-name }}
          EVIDENCE_FILE: ${{ inputs.evidence-file }}
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          USE_EXISTING_DRAFT: ${{ inputs.use-existing-draft }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail

          for candidate in "${CHECKSUM_FILE}" "${CONFIG}" "${GO_VERSION_FILE}" "${WORKING_DIRECTORY}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9._/-]+$ ]] \
              || [[ "${candidate}" == /* ]] \
              || [[ "${candidate}" == *".."* ]] \
              || [[ "${candidate}" == *//* ]]; then
              echo "All paths must be safe repository-relative paths."
              exit 1
            fi
          done

          effective_tag="${GITHUB_REF_NAME}"
          if [[ "${USE_EXISTING_DRAFT}" == "true" ]]; then
            [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || {
              echo "Draft releases must be finalized by workflow_dispatch." >&2
              exit 1
            }
            [[ "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]] || {
              echo "Draft releases must be finalized from the default branch." >&2
              exit 1
            }
            effective_tag="${RELEASE_TAG}"
            [[ "${effective_tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
              echo "Release tag must be SemVer-compatible and start with v." >&2
              exit 1
            }

            releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -s --arg tag "${effective_tag}" '[.[][] | select(.tag_name == $tag)]')"
            if [[ "$(jq 'length' <<< "${releases}")" != "1" ]] \
              || [[ "$(jq -r '.[0].draft' <<< "${releases}")" != "true" ]]; then
              echo "Exactly one draft GitHub release must exist for ${effective_tag}." >&2
              exit 1
            fi
            echo "release-id=$(jq -r '.[0].id' <<< "${releases}")" >> "${GITHUB_OUTPUT}"

            tag_sha="$(git rev-parse --verify "refs/tags/${effective_tag}^{commit}" 2>/dev/null || true)"
            if [[ -n "${tag_sha}" && "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "${effective_tag} resolves to ${tag_sha}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
            if [[ -z "${tag_sha}" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${effective_tag}" \
                -f "sha=${GITHUB_SHA}" >/dev/null
              git fetch --force origin "refs/tags/${effective_tag}:refs/tags/${effective_tag}"
            fi
          elif [[ -n "${RELEASE_TAG}" ]]; then
            echo "release-tag requires use-existing-draft." >&2
            exit 1
          fi

          if [[ ! "${effective_tag}" =~ ^v([0-9]+)[.]([0-9]+)[.]([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be SemVer-compatible and start with v."
            exit 1
          fi
          {
            echo "major=v${BASH_REMATCH[1]}"
            echo "release-tag=${effective_tag}"
          } >> "${GITHUB_OUTPUT}"

          if [[ -n "${EVIDENCE_ARTIFACT_NAME}" || -n "${EVIDENCE_FILE}" ]]; then
            if [[ ! "${EVIDENCE_ARTIFACT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] \
              || [[ ! "${EVIDENCE_FILE}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$ ]]; then
              echo "Evidence artifact and filename must both be present and contain only safe characters."
              exit 1
            fi
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Publish release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --config ${{ inputs.config }}
          workdir: ${{ inputs.working-directory }}
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.validate.outputs.release-tag }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Confirm checksum manifest exists
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CHECKSUM_FILE: ${{ inputs.checksum-file }}
        run: |
          set -euo pipefail
          if [[ ! -s "${CHECKSUM_FILE}" ]]; then
            echo "GoReleaser did not produce the expected checksum manifest: ${CHECKSUM_FILE}"
            exit 1
          fi

      - name: Confirm GoReleaser retained the draft
        if: inputs.use-existing-draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.validate.outputs.release-id }}
        run: |
          set -euo pipefail
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')"
          [[ "${draft}" == "true" ]] || {
            echo "GoReleaser published the draft before provenance and evidence completed." >&2
            echo "Set release.draft and release.use_existing_draft to true in the GoReleaser configuration." >&2
            exit 1
          }

      - name: Generate build provenance for release artifacts
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ inputs.working-directory }}/${{ inputs.checksum-file }}

      - name: Download release evidence
        if: inputs.evidence-artifact-name != '' && inputs.evidence-file != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.evidence-artifact-name }}
          path: ${{ runner.temp }}/release-evidence

      - name: Attach evidence to GitHub release
        if: inputs.evidence-artifact-name != '' && inputs.evidence-file != ''
        shell: bash
        env:
          EVIDENCE_FILE: ${{ inputs.evidence-file }}
          EVIDENCE_PATH: ${{ runner.temp }}/release-evidence/${{ inputs.evidence-file }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate.outputs.release-tag }}
        run: |
          set -euo pipefail
          if [[ ! -s "${EVIDENCE_PATH}" ]]; then
            echo "Release evidence is missing or empty: ${EVIDENCE_FILE}"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${EVIDENCE_PATH}" --clobber

      - name: Publish validated draft
        if: inputs.use-existing-draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.validate.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false >/dev/null

      - name: Confirm release is published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate.outputs.release-tag }}
        run: |
          set -euo pipefail
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')"
          [[ "${draft}" == "false" ]] || {
            echo "GoReleaser did not publish ${RELEASE_TAG}." >&2
            exit 1
          }

      - name: Move major compatibility tag
        if: inputs.update-major-tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR_TAG: ${{ steps.validate.outputs.major }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" \
              -f sha="${RELEASE_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR_TAG}" \
              -f sha="${RELEASE_SHA}" >/dev/null
          fi

      - name: Add release summary
        shell: bash
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RELEASE_TAG: ${{ steps.validate.outputs.release-tag }}
        run: |
          {
            echo "### Go release published and attested"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Attestation: ${ATTESTATION_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
