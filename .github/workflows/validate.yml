name: Validate Shared Workflows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  policy:
    name: workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Enforce shared workflow policy
        shell: bash
        run: .github/scripts/check-workflow-policy.sh

      - name: ShellCheck policy scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .github/scripts
          severity: warning

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: zizmor security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          inputs: .
          online-audits: true
          persona: regular
          version: v1.29.0

  update-v1:
    name: update v1 compatibility tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - actionlint
      - policy
      - zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: update-v1-compatibility-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Move v1 to validated main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "${VALIDATED_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Validated commit is not a full Git SHA."
            exit 1
          fi

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "${current_main}" != "${VALIDATED_SHA}" ]]; then
            echo "Skipping ${VALIDATED_SHA}; main has advanced to ${current_main}."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" \
              -f sha="${VALIDATED_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG_NAME}" \
              -f sha="${VALIDATED_SHA}" >/dev/null
          fi

          {
            echo "### v1 compatibility tag updated"
            echo "- Commit: \`${VALIDATED_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
