name: Build, Attest, and Sign Registry Container

on:
  workflow_call:
    inputs:
      registry:
        description: OCI registry hostname.
        required: true
        type: string
      image-name:
        description: Image path below the registry, without tag or digest.
        required: true
        type: string
      tags:
        description: Newline-delimited fully qualified image tags.
        required: true
        type: string
      registry-username:
        description: Registry username. Use the repository owner for GHCR.
        required: true
        type: string
      context:
        description: Docker build context relative to the repository root.
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile relative to the repository root.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Comma-delimited target platforms.
        required: false
        type: string
        default: linux/amd64
      provenance-enabled:
        description: Generate GitHub build provenance.
        required: false
        type: boolean
        default: true
      cosign-enabled:
        description: Sign and verify the digest-qualified image with keyless Cosign.
        required: false
        type: boolean
        default: true
      certificate-identity-regexp:
        description: Explicit Cosign certificate identity policy.
        required: true
        type: string
    secrets:
      registry-token:
        description: Narrowly scoped registry token.
        required: true
    outputs:
      image-digest:
        description: OCI digest returned by the registry.
        value: ${{ jobs.build.outputs.image-digest }}
      image-ref:
        description: Digest-qualified OCI image reference.
        value: ${{ jobs.build.outputs.image-ref }}

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    name: Build trusted registry container
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.metadata.outputs.subject-name }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Validate inputs
        id: metadata
        shell: bash
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
          CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAGS: ${{ inputs.tags }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ inputs.registry-username }}
        run: |
          set -euo pipefail
          if [[ ! "${REGISTRY}" =~ ^[a-z0-9][a-z0-9.-]*[a-z0-9]$ ]] \
            || [[ ! "${IMAGE_NAME}" =~ ^[a-z0-9][a-z0-9._/-]*[a-z0-9]$ ]] \
            || [[ "${IMAGE_NAME}" == *//* ]] \
            || [[ "${IMAGE_NAME}" == *:* ]] \
            || [[ "${IMAGE_NAME}" == *@* ]] \
            || [[ ! "${REGISTRY_USERNAME}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Registry, image name, or username is invalid."
            exit 1
          fi
          for candidate in "${BUILD_CONTEXT}" "${DOCKERFILE}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9._/-]+$ ]] \
              || [[ "${candidate}" == /* ]] \
              || [[ "${candidate}" == *".."* ]] \
              || [[ "${candidate}" == *//* ]]; then
              echo "Build paths must be safe repository-relative paths."
              exit 1
            fi
          done
          if [[ -z "${CERTIFICATE_IDENTITY_REGEXP}" || "${CERTIFICATE_IDENTITY_REGEXP}" == *$'\n'* ]]; then
            echo "An explicit single-line certificate identity policy is required."
            exit 1
          fi
          subject_name="${REGISTRY}/${IMAGE_NAME}"
          found_tag=false
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            found_tag=true
            if [[ "${tag}" != "${subject_name}:"* ]] \
              || [[ "${tag}" == *@* ]] \
              || [[ ! "${tag}" =~ ^[a-z0-9][a-z0-9.:/_-]+$ ]]; then
              echo "Every tag must belong to ${subject_name}."
              exit 1
            fi
          done <<< "${IMAGE_TAGS}"
          if [[ "${found_tag}" != "true" ]]; then
            echo "At least one image tag is required."
            exit 1
          fi
          echo "subject-name=${subject_name}" >> "${GITHUB_OUTPUT}"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          provenance: false
          push: true
          tags: ${{ inputs.tags }}

      - name: Generate build provenance
        if: inputs.provenance-enabled
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ steps.metadata.outputs.subject-name }}

      - name: Install Cosign
        if: inputs.cosign-enabled
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify image
        if: inputs.cosign-enabled
        shell: bash
        env:
          CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SUBJECT_NAME: ${{ steps.metadata.outputs.subject-name }}
        run: |
          set -euo pipefail
          image_ref="${SUBJECT_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${image_ref}"
          cosign verify \
            --certificate-identity-regexp "${CERTIFICATE_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${image_ref}"
