name: Generate, Sign, and Verify SBOMs

on:
  workflow_call:
    inputs:
      source-directory:
        description: Go module directory relative to the repository root.
        required: false
        type: string
        default: .
      go-version-file:
        description: Path to go.mod relative to the repository root.
        required: false
        type: string
        default: go.mod
      goexperiment:
        description: Optional GOEXPERIMENT value required by the Go module.
        required: false
        type: string
        default: ''
      image-ref:
        description: Digest-qualified container image to inventory.
        required: true
        type: string
      registry:
        description: Container registry hostname.
        required: true
        type: string
      workload-identity-provider:
        description: Full Google Workload Identity Provider resource name.
        required: true
        type: string
      service-account:
        description: Google service-account email used through Workload Identity Federation.
        required: true
        type: string
      secure-sbom-signing-key-id:
        description: SecureSBOM signing-key identifier.
        required: true
        type: string
      artifact-name:
        description: GitHub Actions artifact containing generated SBOMs.
        required: false
        type: string
        default: signed-sboms
      file-prefix:
        description: Safe filename prefix for generated SBOMs.
        required: true
        type: string
    secrets:
      secure-sbom-api-key:
        description: SecureSBOM API key.
        required: true
    outputs:
      artifact-name:
        description: Workflow artifact containing unsigned and signed SBOMs.
        value: ${{ jobs.sbom.outputs.artifact-name }}
      source-sbom-file:
        description: Signed source SBOM filename.
        value: ${{ jobs.sbom.outputs.source-sbom-file }}
      container-sbom-file:
        description: Signed container SBOM filename.
        value: ${{ jobs.sbom.outputs.container-sbom-file }}

permissions: read-all

jobs:
  sbom:
    name: Generate and protect SBOMs
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
      source-sbom-file: ${{ steps.files.outputs.source-signed }}
      container-sbom-file: ${{ steps.files.outputs.container-signed }}
    steps:
      - name: Validate inputs
        id: files
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          FILE_PREFIX: ${{ inputs.file-prefix }}
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
          IMAGE_REF: ${{ inputs.image-ref }}
          REGISTRY: ${{ inputs.registry }}
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        run: |
          set -euo pipefail

          for candidate in "${GO_VERSION_FILE}" "${SOURCE_DIRECTORY}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9._/-]+$ ]] \
              || [[ "${candidate}" == /* ]] \
              || [[ "${candidate}" == *".."* ]] \
              || [[ "${candidate}" == *//* ]]; then
              echo "Source paths must be safe repository-relative paths."
              exit 1
            fi
          done

          if [[ ! "${IMAGE_REF}" =~ ^[a-z0-9][a-z0-9.:/_-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Image reference must be fully qualified and contain an sha256 digest."
            exit 1
          fi
          if [[ ! "${REGISTRY}" =~ ^[a-z0-9][a-z0-9.-]*[a-z0-9]$ ]]; then
            echo "Registry must be a hostname without a scheme or path."
            exit 1
          fi
          if [[ ! "${FILE_PREFIX}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo "File prefix contains unsupported characters or is too long."
            exit 1
          fi
          if [[ ! "${ARTIFACT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo "Artifact name contains unsupported characters or is too long."
            exit 1
          fi

          {
            echo "source=${FILE_PREFIX}.source.cdx.json"
            echo "source-signed=${FILE_PREFIX}.source.cdx.signed.json"
            echo "container=${FILE_PREFIX}.container.cdx.json"
            echo "container-signed=${FILE_PREFIX}.container.cdx.signed.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: false
          token_format: access_token
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ inputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}

      - name: Install cyclonedx-gomod
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
        with:
          version: v1.12.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate source SBOM
        shell: bash
        working-directory: ${{ inputs.source-directory }}
        env:
          GOEXPERIMENT: ${{ inputs.goexperiment }}
          OUTPUT_FILE: ${{ github.workspace }}/${{ steps.files.outputs.source }}
        run: |
          set -euo pipefail
          cyclonedx-gomod app \
            -licenses \
            -json \
            -output-version 1.6 \
            -output "${OUTPUT_FILE}" \
            .

      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: cyclonedx
          output: ${{ steps.files.outputs.container }}

      - name: Sign source SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.source }}
          secure_sbom_action: sign_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Sign container SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.container }}
          secure_sbom_action: sign_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Verify source SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.source-signed }}
          secure_sbom_action: verify_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Verify container SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.container-signed }}
          secure_sbom_action: verify_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Confirm signed outputs
        shell: bash
        env:
          CONTAINER_SIGNED: ${{ steps.files.outputs.container-signed }}
          SOURCE_SIGNED: ${{ steps.files.outputs.source-signed }}
        run: |
          set -euo pipefail
          for signed_file in "${SOURCE_SIGNED}" "${CONTAINER_SIGNED}"; do
            if [[ ! -s "${signed_file}" ]]; then
              echo "Expected signed SBOM was not created: ${signed_file}"
              exit 1
            fi
          done

      - name: Upload signed SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.files.outputs.source }}
            ${{ steps.files.outputs.source-signed }}
            ${{ steps.files.outputs.container }}
            ${{ steps.files.outputs.container-signed }}

      - name: Add SBOM summary
        shell: bash
        run: |
          {
            echo "### SBOM evidence generated"
            echo "- Source SBOM: \`${{ steps.files.outputs.source-signed }}\`"
            echo "- Container SBOM: \`${{ steps.files.outputs.container-signed }}\`"
            echo "- Artifact: \`${{ inputs.artifact-name }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
