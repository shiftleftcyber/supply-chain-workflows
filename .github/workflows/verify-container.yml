name: Verify Container Evidence

on:
  workflow_call:
    inputs:
      image-ref:
        description: Fully qualified OCI image reference containing an sha256 digest.
        required: true
        type: string
      attestation-repository:
        description: Repository associated with the attestation, in owner/name form.
        required: true
        type: string
      signer-workflow:
        description: Expected reusable signer workflow, in owner/repository/path form.
        required: true
        type: string
      registry:
        description: Registry hostname. Required when Workload Identity Federation is configured.
        required: false
        type: string
        default: ''
      workload-identity-provider:
        description: Optional Google Workload Identity Provider resource name for private GAR images.
        required: false
        type: string
        default: ''
      service-account:
        description: Optional Google service-account email for private GAR images.
        required: false
        type: string
        default: ''
      cosign-enabled:
        description: Also require a valid keyless Cosign signature.
        required: false
        type: boolean
        default: true
      certificate-identity-regexp:
        description: Required Cosign certificate identity policy when Cosign verification is enabled.
        required: false
        type: string
        default: ''
      certificate-oidc-issuer:
        description: Expected Cosign certificate OIDC issuer.
        required: false
        type: string
        default: https://token.actions.githubusercontent.com
    secrets:
      attestation-token:
        description: Optional token for cross-repository private attestation access.
        required: false

permissions: read-all

jobs:
  verify:
    name: Verify immutable container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate policy inputs
        shell: bash
        env:
          ATTESTATION_REPOSITORY: ${{ inputs.attestation-repository }}
          CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          COSIGN_ENABLED: ${{ inputs.cosign-enabled }}
          IMAGE_REF: ${{ inputs.image-ref }}
          REGISTRY: ${{ inputs.registry }}
          SERVICE_ACCOUNT: ${{ inputs.service-account }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.workload-identity-provider }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_REF}" =~ ^[a-z0-9][a-z0-9.:/_-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Image reference must be fully qualified and contain an sha256 digest."
            exit 1
          fi

          if [[ ! "${ATTESTATION_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Attestation repository must use owner/name format."
            exit 1
          fi

          if [[ ! "${SIGNER_WORKFLOW}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$ ]]; then
            echo "Signer workflow must identify an exact reusable workflow file."
            exit 1
          fi

          configured=0
          [[ -n "${REGISTRY}" ]] && configured=$((configured + 1))
          [[ -n "${SERVICE_ACCOUNT}" ]] && configured=$((configured + 1))
          [[ -n "${WORKLOAD_IDENTITY_PROVIDER}" ]] && configured=$((configured + 1))
          if [[ "${configured}" -ne 0 && "${configured}" -ne 3 ]]; then
            echo "Registry, workload identity provider, and service account must be configured together."
            exit 1
          fi

          if [[ "${COSIGN_ENABLED}" == "true" && -z "${CERTIFICATE_IDENTITY_REGEXP}" ]]; then
            echo "Cosign verification requires an explicit certificate identity policy."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: google-auth
        if: inputs.workload-identity-provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: false
          token_format: access_token
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Authenticate Docker to Artifact Registry
        if: inputs.workload-identity-provider != ''
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ inputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}

      - name: Verify SLSA provenance
        shell: bash
        env:
          ATTESTATION_REPOSITORY: ${{ inputs.attestation-repository }}
          GH_TOKEN: ${{ secrets.attestation-token || github.token }}
          IMAGE_REF: ${{ inputs.image-ref }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${ATTESTATION_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}"

      - name: Install Cosign
        if: inputs.cosign-enabled
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify Cosign signature
        if: inputs.cosign-enabled
        shell: bash
        env:
          CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          CERTIFICATE_OIDC_ISSUER: ${{ inputs.certificate-oidc-issuer }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "${CERTIFICATE_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${CERTIFICATE_OIDC_ISSUER}" \
            "${IMAGE_REF}"

      - name: Add verification summary
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
        run: |
          {
            echo "### Container evidence verified"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Signer workflow: \`${SIGNER_WORKFLOW}\`"
            echo "- Cosign required: \`${{ inputs.cosign-enabled }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
