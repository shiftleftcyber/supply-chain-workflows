name: Generate and Protect Go Source SBOM

on:
  workflow_call:
    inputs:
      source-directory:
        description: Go module directory relative to the repository root.
        required: false
        type: string
        default: .
      go-version-file:
        description: Path to go.mod relative to the repository root.
        required: false
        type: string
        default: go.mod
      goexperiment:
        description: Optional GOEXPERIMENT value required by the module.
        required: false
        type: string
        default: ''
      secure-sbom-signing-key-id:
        description: SecureSBOM signing-key identifier.
        required: true
        type: string
      file-prefix:
        description: Safe filename prefix.
        required: true
        type: string
      artifact-name:
        description: Artifact containing the SBOM and scan evidence.
        required: false
        type: string
        default: signed-source-sbom
      fail-on-vulnerabilities:
        description: Fail when OSV Scanner reports a vulnerability.
        required: false
        type: boolean
        default: true
    secrets:
      secure-sbom-api-key:
        description: SecureSBOM API key.
        required: true
    outputs:
      artifact-name:
        description: Uploaded evidence artifact.
        value: ${{ jobs.sbom.outputs.artifact-name }}
      signed-sbom-file:
        description: Signed source SBOM filename.
        value: ${{ jobs.sbom.outputs.signed-sbom-file }}

permissions: read-all

jobs:
  sbom:
    name: Generate, sign, verify, and scan Go SBOM
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
      signed-sbom-file: ${{ steps.files.outputs.signed }}
    steps:
      - name: Validate inputs
        id: files
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          FILE_PREFIX: ${{ inputs.file-prefix }}
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        run: |
          set -euo pipefail
          for candidate in "${GO_VERSION_FILE}" "${SOURCE_DIRECTORY}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9._/-]+$ ]] \
              || [[ "${candidate}" == /* ]] \
              || [[ "${candidate}" == *".."* ]] \
              || [[ "${candidate}" == *//* ]]; then
              echo "Source paths must be safe repository-relative paths."
              exit 1
            fi
          done
          for candidate in "${ARTIFACT_NAME}" "${FILE_PREFIX}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
              echo "Artifact and file names must contain only safe characters."
              exit 1
            fi
          done
          {
            echo "unsigned=${FILE_PREFIX}.source.cdx.json"
            echo "signed=${FILE_PREFIX}.source.cdx.signed.json"
            echo "report=${FILE_PREFIX}.source.osv.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Install cyclonedx-gomod
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
        with:
          version: v1.12.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate source SBOM
        shell: bash
        working-directory: ${{ inputs.source-directory }}
        env:
          GOEXPERIMENT: ${{ inputs.goexperiment }}
          OUTPUT_FILE: ${{ github.workspace }}/${{ steps.files.outputs.unsigned }}
        run: |
          set -euo pipefail
          cyclonedx-gomod app -licenses -json -output-version 1.6 -output "${OUTPUT_FILE}" .

      - name: Sign source SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.unsigned }}
          secure_sbom_action: sign_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Verify signed source SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.signed }}
          secure_sbom_action: verify_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Scan signed source SBOM
        id: osv
        continue-on-error: true
        shell: bash
        env:
          OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner@sha256:4d3d1a42ba435ac706286fec518c044f049c9753d21260b5bae60bab8740ed97
          REPORT_FILE: ${{ steps.files.outputs.report }}
          SBOM_FILE: ${{ steps.files.outputs.signed }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            "${OSV_SCANNER_IMAGE}" scan --format json --output "${REPORT_FILE}" "${SBOM_FILE}"

      - name: Confirm generated evidence
        shell: bash
        env:
          SIGNED_FILE: ${{ steps.files.outputs.signed }}
        run: |
          set -euo pipefail
          if [[ ! -s "${SIGNED_FILE}" ]]; then
            echo "Signed SBOM was not created."
            exit 1
          fi

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.files.outputs.unsigned }}
            ${{ steps.files.outputs.signed }}
            ${{ steps.files.outputs.report }}

      - name: Enforce vulnerability policy
        if: inputs.fail-on-vulnerabilities && steps.osv.outcome != 'success'
        shell: bash
        run: |
          echo "OSV Scanner found vulnerabilities or failed to complete."
          exit 1
