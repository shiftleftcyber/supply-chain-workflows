name: Generate and Protect Go Source SBOM

on:
  workflow_call:
    inputs:
      source-directory:
        description: Go module directory relative to the repository root.
        required: false
        type: string
        default: .
      go-version-file:
        description: Path to go.mod relative to the repository root.
        required: false
        type: string
        default: go.mod
      goexperiment:
        description: Optional GOEXPERIMENT value required by the module.
        required: false
        type: string
        default: ''
      component-type:
        description: CycloneDX component type; use library for non-main Go modules.
        required: false
        type: string
        default: application
      secure-sbom-signing-key-id:
        description: SecureSBOM signing-key identifier.
        required: true
        type: string
      file-prefix:
        description: Safe filename prefix.
        required: true
        type: string
      artifact-name:
        description: Artifact containing the unsigned and signed SBOM.
        required: false
        type: string
        default: signed-source-sbom
      fail-on-vulnerabilities:
        description: Deprecated compatibility input; scanning now belongs in scan-sbom-osv.yml.
        required: false
        type: boolean
        default: true
    secrets:
      secure-sbom-api-key:
        description: SecureSBOM API key.
        required: true
    outputs:
      artifact-name:
        description: Uploaded evidence artifact.
        value: ${{ jobs.sbom.outputs.artifact-name }}
      signed-sbom-file:
        description: Signed source SBOM filename.
        value: ${{ jobs.sbom.outputs.signed-sbom-file }}

permissions:
  contents: read

jobs:
  sbom:
    name: Generate, sign, and verify Go SBOM
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
      signed-sbom-file: ${{ steps.files.outputs.signed }}
    steps:
      - name: Validate inputs
        id: files
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          COMPONENT_TYPE: ${{ inputs.component-type }}
          DEPRECATED_FAIL_ON_VULNERABILITIES: ${{ inputs.fail-on-vulnerabilities }}
          FILE_PREFIX: ${{ inputs.file-prefix }}
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        run: |
          set -euo pipefail
          if [[ "${DEPRECATED_FAIL_ON_VULNERABILITIES}" == "true" ]]; then
            echo "::warning::fail-on-vulnerabilities is deprecated; call scan-sbom-osv.yml explicitly."
          fi
          if [[ "${COMPONENT_TYPE}" != "application" && "${COMPONENT_TYPE}" != "library" ]]; then
            echo "Component type must be application or library."
            exit 1
          fi
          for candidate in "${GO_VERSION_FILE}" "${SOURCE_DIRECTORY}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9._/-]+$ ]] \
              || [[ "${candidate}" == /* ]] \
              || [[ "${candidate}" == *".."* ]] \
              || [[ "${candidate}" == *//* ]]; then
              echo "Source paths must be safe repository-relative paths."
              exit 1
            fi
          done
          for candidate in "${ARTIFACT_NAME}" "${FILE_PREFIX}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
              echo "Artifact and file names must contain only safe characters."
              exit 1
            fi
          done
          {
            echo "unsigned=${FILE_PREFIX}.source.cdx.json"
            echo "signed=${FILE_PREFIX}.source.cdx.signed.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Install cyclonedx-gomod
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
        with:
          version: v1.12.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate source SBOM
        shell: bash
        working-directory: ${{ inputs.source-directory }}
        env:
          COMPONENT_TYPE: ${{ inputs.component-type }}
          GOEXPERIMENT: ${{ inputs.goexperiment }}
          OUTPUT_FILE: ${{ github.workspace }}/${{ steps.files.outputs.unsigned }}
        run: |
          set -euo pipefail
          if [[ "${COMPONENT_TYPE}" == "library" ]]; then
            cyclonedx-gomod mod -type library -licenses -json -output-version 1.6 -output "${OUTPUT_FILE}" .
          else
            cyclonedx-gomod app -licenses -json -output-version 1.6 -output "${OUTPUT_FILE}" .
          fi

      - name: Sign source SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.unsigned }}
          secure_sbom_action: sign_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Verify signed source SBOM
        uses: shiftleftcyber/secure-sbom-action@542dffaadd81bc0614947d749720558a399e6454 # v2.4.0
        with:
          sbom_file: ${{ steps.files.outputs.signed }}
          secure_sbom_action: verify_sbom
          secure_sbom_api_key: ${{ secrets.secure-sbom-api-key }}
          secure_sbom_signing_key_id: ${{ inputs.secure-sbom-signing-key-id }}

      - name: Confirm generated evidence
        shell: bash
        env:
          SIGNED_FILE: ${{ steps.files.outputs.signed }}
        run: |
          set -euo pipefail
          if [[ ! -s "${SIGNED_FILE}" ]]; then
            echo "Signed SBOM was not created."
            exit 1
          fi

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.files.outputs.unsigned }}
            ${{ steps.files.outputs.signed }}
