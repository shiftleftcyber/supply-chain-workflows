name: Scan SBOM with OSV Scanner

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Existing workflow artifact containing the SBOM.
        required: true
        type: string
      sbom-file:
        description: SBOM JSON basename within the downloaded artifact.
        required: true
        type: string
      report-artifact-name:
        description: Artifact name for the OSV JSON, HTML, and SARIF reports.
        required: false
        type: string
        default: osv-scan-report
      fail-on-vulnerabilities:
        description: Fail when OSV Scanner reports vulnerabilities.
        required: false
        type: boolean
        default: false
    outputs:
      report-artifact-name:
        description: Uploaded artifact containing the OSV JSON, HTML, and SARIF reports.
        value: ${{ jobs.scan.outputs.report-artifact-name }}

permissions:
  actions: read
  contents: read

jobs:
  scan:
    name: Scan SBOM with OSV Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      report-artifact-name: ${{ inputs.report-artifact-name }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          REPORT_ARTIFACT_NAME: ${{ inputs.report-artifact-name }}
          SBOM_FILE: ${{ inputs.sbom-file }}
        run: |
          set -euo pipefail
          for candidate in "${ARTIFACT_NAME}" "${REPORT_ARTIFACT_NAME}"; do
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
              echo "Artifact names must contain only safe characters."
              exit 1
            fi
          done
          if [[ ! "${SBOM_FILE}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,119}[.]json$ ]]; then
            echo "SBOM file must be a safe JSON basename."
            exit 1
          fi

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: input

      - name: Prepare OSV-compatible SBOM name
        id: prepare
        shell: bash
        env:
          SBOM_FILE: ${{ inputs.sbom-file }}
        run: |
          set -euo pipefail
          source_file="input/${SBOM_FILE}"
          if [[ ! -f "${source_file}" || ! -s "${source_file}" ]]; then
            echo "The requested SBOM is missing or empty."
            exit 1
          fi
          if ! jq -e '
            .bomFormat == "CycloneDX" and
            (.specVersion | type == "string") and
            (.metadata.component | type == "object") and
            ((has("components") | not) or (.components | type == "array")) and
            (has("signature") | not)
          ' "${source_file}" >/dev/null; then
            echo "The requested file is not a supported unsigned CycloneDX SBOM." >&2
            exit 1
          fi
          component_count="$(jq '(.components // []) | length' "${source_file}")"
          if [[ ! "${component_count}" =~ ^[0-9]+$ ]]; then
            echo "Could not determine the SBOM component count."
            exit 1
          fi
          if [[ "${component_count}" -eq 0 ]]; then
            echo "has-packages=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has-packages=true" >> "${GITHUB_OUTPUT}"
          fi
          mkdir -p osv-input report
          cp -- "${source_file}" osv-input/bom.json
          source_hash="$(sha256sum "${source_file}" | cut -d ' ' -f 1)"
          scan_hash="$(sha256sum osv-input/bom.json | cut -d ' ' -f 1)"
          if [[ "${source_hash}" != "${scan_hash}" ]] || ! cmp --silent "${source_file}" osv-input/bom.json; then
            echo "The OSV-compatible copy does not match the source SBOM."
            exit 1
          fi

      - name: Scan SBOM
        id: osv
        if: steps.prepare.outputs.has-packages == 'true'
        shell: bash
        env:
          OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 # v2.7.0
        run: |
          set -uo pipefail
          operational_error=false
          findings=false

          run_scan() {
            local format="$1"
            local output_file="$2"
            local exit_code=0
            docker run --rm \
              --read-only \
              --volume "${GITHUB_WORKSPACE}/osv-input:/input:ro" \
              --volume "${GITHUB_WORKSPACE}/report:/report" \
              "${OSV_SCANNER_IMAGE}" scan \
                --format "${format}" \
                --output-file "/report/${output_file}" \
                /input/bom.json || exit_code=$?

            case "${exit_code}" in
              0) ;;
              1) findings=true ;;
              *)
                echo "OSV Scanner failed while generating ${format} output (exit ${exit_code})." >&2
                operational_error=true
                ;;
            esac
          }

          run_scan json osv-results.json
          run_scan html osv-results.html
          run_scan sarif osv-results.sarif

          echo "findings=${findings}" >> "${GITHUB_OUTPUT}"
          echo "operational-error=${operational_error}" >> "${GITHUB_OUTPUT}"

      - name: Create empty reports for a zero-dependency SBOM
        if: steps.prepare.outputs.has-packages == 'false'
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{results: []}' > report/osv-results.json
          jq -n '{
            version: "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            runs: [{
              tool: {driver: {name: "OSV-Scanner", informationUri: "https://google.github.io/osv-scanner/"}},
              results: []
            }]
          }' > report/osv-results.sarif
          cat > report/osv-results.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>OSV vulnerability scan</title></head>
          <body><h1>OSV vulnerability scan</h1><p>The SBOM contains no dependency components to scan.</p></body>
          </html>
          EOF

      - name: Publish scan summary
        if: always() && hashFiles('report/osv-results.json') != ''
        shell: bash
        env:
          FINDINGS: ${{ steps.osv.outputs.findings }}
          OPERATIONAL_ERROR: ${{ steps.osv.outputs.operational-error }}
          HAS_PACKAGES: ${{ steps.prepare.outputs.has-packages }}
          REPORT_ARTIFACT_NAME: ${{ inputs.report-artifact-name }}
        run: |
          set -euo pipefail
          jq -e '.results | type == "array"' report/osv-results.json >/dev/null

          vulnerable_packages="$(jq '[.results[]?.packages[]? | select((.groups // []) | length > 0)] | length' report/osv-results.json)"
          vulnerability_groups="$(jq '[.results[]?.packages[]?.groups[]?] | length' report/osv-results.json)"

          {
            echo "## OSV vulnerability scan"
            echo
            if [[ "${HAS_PACKAGES}" == "false" ]]; then
              echo "The SBOM contains no dependency components to scan."
            elif [[ "${OPERATIONAL_ERROR}" == "true" ]]; then
              echo "> [!CAUTION]"
              echo "> OSV Scanner did not complete successfully. This job will fail."
            elif [[ "${FINDINGS}" == "true" ]]; then
              echo "> [!WARNING]"
              echo "> OSV found ${vulnerability_groups} vulnerability group(s) affecting ${vulnerable_packages} package(s)."
            else
              echo "No known vulnerabilities were found."
            fi
            echo
            echo "Detailed JSON, HTML, and SARIF reports are available in the \`${REPORT_ARTIFACT_NAME}\` workflow artifact."
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${FINDINGS}" == "true" ]]; then
            echo "::warning title=OSV vulnerabilities found::${vulnerability_groups} vulnerability group(s) affect ${vulnerable_packages} package(s). Review the ${REPORT_ARTIFACT_NAME} artifact."
          fi

      - name: Upload OSV reports
        if: always() && hashFiles('report/osv-results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.report-artifact-name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            report/osv-results.html
            report/osv-results.json
            report/osv-results.sarif

      - name: Enforce scan policy
        if: always() && (steps.osv.outputs.operational-error == 'true' || (steps.osv.outputs.findings == 'true' && inputs.fail-on-vulnerabilities))
        shell: bash
        env:
          FAIL_ON_VULNERABILITIES: ${{ inputs.fail-on-vulnerabilities }}
          FINDINGS: ${{ steps.osv.outputs.findings }}
          OPERATIONAL_ERROR: ${{ steps.osv.outputs.operational-error }}
        run: |
          if [[ "${OPERATIONAL_ERROR}" == "true" ]]; then
            echo "OSV Scanner failed to complete successfully." >&2
          elif [[ "${FINDINGS}" == "true" && "${FAIL_ON_VULNERABILITIES}" == "true" ]]; then
            echo "OSV Scanner found vulnerabilities and blocking enforcement is enabled." >&2
          else
            echo "The OSV scan policy reached an unexpected state." >&2
          fi
          exit 1
